# Manifest dell'app Slack (modalità "solo app": nessun canale, nessun comando).
# 1. Sostituisci il sottodominio workers.dev negli URL qui sotto con il tuo (Cloudflare -> Workers e Pages).
# 2. Su https://api.slack.com/apps -> Create New App -> From a manifest, incolla e crea
#    (per un'app esistente: la tua app -> "App Manifest", incolla e salva, poi Reinstall).
# Per usare anche un canale di iscrizione (SLACK_CHANNEL_IDS) servono in più gli scope channels:read,
# groups:read, users:read e gli eventi member_joined_channel / member_left_channel.
display_information:
  name: anas-bot
  description: Chiusure, riaperture e limiti ANAS in privato, nelle zone che scegli · di checcoconf per Waze Italia
  long_description: >-
    anas-bot legge le ordinanze pubblicate da ANAS su Ordinanze Web e manda un messaggio privato agli editor
    Waze Italia che hanno scelto di seguire una o più zone (tutta Italia, regioni o province): chiusure di strade,
    carreggiate, rampe e svincoli, riaperture, nuove strade e nuovi limiti di velocità permanenti, con strada,
    chilometri, date e il link al PDF dell'ordinanza. Chi vuole può ricevere a parte anche tutte le altre
    ordinanze (cantieri, corsie ridotte, sensi unici alternati...) nelle zone che sceglie per quelle.
    Appena scelte le zone arriva il riepilogo delle ordinanze già in vigore, poi solo le novità.
    Per attivarlo basta aprire la scheda Home dell'app e scegliere le zone; per fermarlo, metterlo in pausa
    dalla stessa scheda. Le chiusure autostradali arrivano anche nel canale dedicato. Per l'Alto Adige e l'A22
    arrivano anche gli avvisi della Centrale Viabilità della Provincia di Bolzano e dell'Autostrada del Brennero.
    Non legge nessun messaggio. I dati ANAS, della Provincia di Bolzano e dell'A22 sono pubblici; l'app conserva solo l'ID Slack e le zone scelte da chi la attiva.
    Ideata e sviluppata da Francesco Conforti (checcoconf) per la community Waze Italia.
    Codice sorgente: https://github.com/checcoconf/anas-slack-bot
  background_color: "#1f3a5f"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: anas-bot
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write          # mandare i messaggi privati
      - im:write            # aprire la conversazione privata con un utente
settings:
  event_subscriptions:
    request_url: https://anas-slack-bot.francesco-conforti03.workers.dev/slack/events
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
    request_url: https://anas-slack-bot.francesco-conforti03.workers.dev/slack/interactivity
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
