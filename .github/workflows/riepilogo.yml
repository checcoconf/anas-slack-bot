# Mini-job: riepilogo delle ordinanze in vigore a chi ha appena scelto le zone.
# Lo avvia il Worker subito dopo il salvataggio delle preferenze (workflow_dispatch). Non fa richieste
# ad ANAS, quindi non ha il gruppo di concorrenza del giro orario: parte anche mentre quello gira.
name: Riepilogo per chi sceglie le zone

on:
  workflow_dispatch:

concurrency:
  group: riepilogo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  riepilogo:
    name: Manda le ordinanze già in vigore ai nuovi iscritti
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Riepilogo -> Slack
        run: python -m anas_bot.digest_job
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          UNKNOWN_PROVINCE_FALLBACK: ${{ vars.UNKNOWN_PROVINCE_FALLBACK }}
