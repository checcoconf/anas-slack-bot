# Test automatici a ogni modifica: parte Python (job) e parte JavaScript (Worker).
name: Test automatici

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-job-python:
    name: Test del job Python (lettura ANAS, classificazione, Slack)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  test-worker:
    name: Test del Worker (modulo Slack, ponte ANAS)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm test
