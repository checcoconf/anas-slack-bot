# Il lavoro periodico: scarica le ordinanze ANAS nuove, le classifica e manda i messaggi privati.
# Lo avvia il Cloudflare Worker una volta l'ora (workflow_dispatch); ogni giro dura quasi un'ora. La pianificazione qui sotto
# è solo una riserva: GitHub la sospende dopo 60 giorni senza commit sulle repo pubbliche.
name: Giro ANAS (ogni ora)

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */3 * * *"

# Mai due giri veri in parallelo (il tetto orario è contato nel database, ma la rotazione andrebbe a
# zig-zag). Il giro di riserva (schedule, ogni 3 ore) ha una coda sua: parte subito, legge che il Worker
# ha avviato un giro da poco e si chiude in pochi secondi, invece di restare in coda e farsi cancellare.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'anas-job-riserva' || 'anas-job' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  giro-anas:
    name: Legge Ordinanze Web e avvisa gli iscritti
    runs-on: ubuntu-24.04
    timeout-minutes: 75  # il giro dura ~50 minuti (JOB_TIME_BUDGET_MINUTES) più l'attesa del budget orario (max 15) e l'ultima richiesta
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          # requirements-ai.txt NON qui: la ruota di llama.cpp ha una cache sua (sotto), senza chiavi di riserva
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      # Secondo parere del modello locale (anas_bot/ai.py): facoltativo, se qualcosa fallisce il giro va avanti senza.
      # Il modello (4,7 GB) e la ruota di llama-cpp-python restano ciascuno in una cache di Actions dedicata.
      - name: Modello locale dalla cache
        id: model-cache
        if: vars.AI_MODE != 'off'
        uses: actions/cache@v4
        with:
          path: ~/modelli/modello.gguf
          key: modello-${{ vars.AI_MODEL_URL || 'qwen2.5-7b-instruct-q4_k_m' }}
      - name: Scarica il modello locale (solo la prima volta)
        if: vars.AI_MODE != 'off' && steps.model-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          mkdir -p ~/modelli
          curl -L --fail --retry 3 -o ~/modelli/modello.gguf \
            "${{ vars.AI_MODEL_URL || 'https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf' }}"
      # llama-cpp-python: compilata UNA volta, portabile, e tenuta in una cache tutta sua. Perché così:
      # - GGML_NATIVE=OFF: solo istruzioni comuni a tutti i runner (AVX2). Una ruota "su misura" per la CPU
      #   del runner che l'ha compilata crolla ("illegal instruction") sui runner con CPU diverse (05/11/2026);
      # - non nella cache pip: quella di setup-python ha una chiave di riserva che riportava indietro la ruota
      #   vecchia, e pip la riusava ignorando le opzioni di compilazione;
      # - l'installazione accetta SOLO la ruota di questa cache (--only-binary): mai una copia vecchia, mai
      #   una ricompilazione a sorpresa. Se manca, il giro va avanti senza modello.
      # Per ricompilare (nuova versione, nuove opzioni): cambiare "avx2-v2" nella chiave.
      - name: Ruota di llama.cpp dalla cache
        id: llama-cache
        if: vars.AI_MODE != 'off'
        uses: actions/cache@v4
        with:
          path: ~/ruote-llama
          key: llama-portabile-avx2-v2-py3.13-${{ hashFiles('requirements-ai.txt') }}
      - name: Compila llama.cpp per Python (solo la prima volta, ~3 minuti)
        if: vars.AI_MODE != 'off' && steps.llama-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON"
        run: pip wheel --no-cache-dir --no-deps -w ~/ruote-llama -r requirements-ai.txt
      - name: Installa llama.cpp per Python
        if: vars.AI_MODE != 'off'
        continue-on-error: true
        run: pip install --no-cache-dir --find-links ~/ruote-llama --only-binary llama-cpp-python -r requirements-ai.txt

      - name: Giro ANAS -> Slack
        run: python -m anas_bot.job
        env:
          # "schedule" = pianificazione di riserva (ogni 3 ore): il job la ignora se l'orologio del Worker
          # ha già fatto partire un giro da poco, per non accodare due giri nella stessa ora
          RUN_TRIGGER: ${{ github.event_name }}
          # Secrets (Settings -> Secrets and variables -> Actions -> Secrets)
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # facoltativo: token di un altro workspace per il solo canale admin (es. quello di test)
          ADMIN_SLACK_BOT_TOKEN: ${{ secrets.ADMIN_SLACK_BOT_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          # Variables (stessa pagina -> Variables)
          SLACK_CHANNEL_IDS: ${{ vars.SLACK_CHANNEL_IDS }}  # vuota = modalità solo app (iscrizione dalla Home)
          ADMIN_CHANNEL_ID: ${{ vars.ADMIN_CHANNEL_ID }}
          ANAS_START_ID: ${{ vars.ANAS_START_ID }}
          ANAS_USER_AGENT: ${{ vars.ANAS_USER_AGENT }}
          WELCOME_EXISTING_MEMBERS: ${{ vars.WELCOME_EXISTING_MEMBERS }}
          UNKNOWN_PROVINCE_FALLBACK: ${{ vars.UNKNOWN_PROVINCE_FALLBACK }}
          # Facoltative: se non le crei valgono i default (vedi README, "Buono a sapersi")
          LISTING_STRUCTURES_PER_RUN: ${{ vars.LISTING_STRUCTURES_PER_RUN }}
          LISTING_FAST_PAGES_MIN: ${{ vars.LISTING_FAST_PAGES_MIN }}
          LISTING_FAST_PAGES_MAX: ${{ vars.LISTING_FAST_PAGES_MAX }}
          WALK_ALWAYS: ${{ vars.WALK_ALWAYS }}
          ANAS_ROUTE: ${{ vars.ANAS_ROUTE }}
          REQUEST_DELAY_SECONDS: ${{ vars.REQUEST_DELAY_SECONDS }}
          MAX_PDF_PER_RUN: ${{ vars.MAX_PDF_PER_RUN }}
          MAX_PDF_PER_RUN_DAY: ${{ vars.MAX_PDF_PER_RUN_DAY }}
          MAX_REQUESTS_PER_HOUR: ${{ vars.MAX_REQUESTS_PER_HOUR }}
          CHANNEL_SUBSCRIPTIONS: ${{ vars.CHANNEL_SUBSCRIPTIONS }}
          BLOCK_PAUSE_MINUTES: ${{ vars.BLOCK_PAUSE_MINUTES }}
          JOB_TIME_BUDGET_MINUTES: ${{ vars.JOB_TIME_BUDGET_MINUTES }}
          LISTING_DEEP_PAGES: ${{ vars.LISTING_DEEP_PAGES }}
          LISTING_DEEP_HOURS: ${{ vars.LISTING_DEEP_HOURS }}
          # codice concordato con ANAS per l'eccezione nel loro firewall (se ve lo danno)
          ANAS_BOT_KEY: ${{ secrets.ANAS_BOT_KEY }}
          AI_MODE: ${{ vars.AI_MODE }}          # flag (default) | log | off
          AI_MODEL_PATH: ${{ vars.AI_MODE != 'off' && '~/modelli/modello.gguf' || '' }}
          WORKER_URL: ${{ vars.WORKER_URL }}
